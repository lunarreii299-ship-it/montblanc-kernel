name: Find which system file contains the failing instruction
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CM system and the stock one is not needed here
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi e2fsprogs
          mkdir cm && cd cm
          curl -fL --retry 3 -o cm.zip https://archive.org/download/cmarchive_nighlies/cm-12.1-20161016-NIGHTLY-hlte.zip
          unzip -q cm.zip system.new.dat system.transfer.list boot.img
          python3 - <<'P'
          import re,struct
          lines=open('system.transfer.list').read().split('\n')
          src=open('system.new.dat','rb'); out=open('/tmp/cm.raw','wb')
          for l in lines[2:]:
              m=re.match(r'new (\S+)',l)
              if not m: continue
              r=list(map(int,m.group(1).split(',')))[1:]
              for a,b in zip(r[0::2],r[1::2]):
                  out.seek(a*4096); out.write(src.read((b-a)*4096))
          out.close()
          d=open('/tmp/cm.raw','rb'); d.seek(1028); blocks=struct.unpack('<I',d.read(4))[0]; d.close()
          open('/tmp/cm.raw','r+b').truncate(blocks*4096)
          P
          sudo mkdir -p /mnt/cm && sudo mount -o loop,ro /tmp/cm.raw /mnt/cm && ls /mnt/cm | head -3
      - name: Search every file for the failing code
        run: |
          sudo python3 - <<'P'
          import os
          pat=bytes.fromhex('1e0f51ec')
          full=bytes.fromhex('00f020e3'+'00f020e3'+'f00160f2'+'1eff2fe1'+'1e0f51ec')
          for r,_,fs in os.walk('/mnt/cm'):
              for f in fs:
                  p=os.path.join(r,f)
                  if os.path.islink(p) or not os.path.isfile(p): continue
                  try: d=open(p,'rb').read()
                  except: continue
                  if pat in d:
                      i=d.find(pat)
                      print('FOUND',p,len(d),'offset',hex(i),'full-sequence' if full in d else '', 'file offset mod 4096:',hex(i%4096))
          print('scan done')
          P
      - name: Same search in the boot image kernel (is the kernel itself reading it?)
        run: |
          python3 - <<'P'
          d=open('cm/boot.img','rb').read()
          print('boot.img has pattern:', bytes.fromhex('1e0f51ec') in d)
          P
