name: Build KK baseline (Note 3 N9005 KitKat source)
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant defconfig"
        default: "msm8974_sec_h3g_chn_defconfig"
      gcc:
        description: "Toolchain: 4.9 (default) or 4.7 (Samsung's own compiler generation)"
        default: "4.9"
      dt_patch:
        description: "Same-length string patches inside dt.img, e.g. qcom,lpm-levels=qcom,lpm-levelz (comma separated)"
        default: ""
      stock_payload:
        description: "Control test: put the STOCK kernel Image inside this build's loader (true/false)"
        default: "false"
      strip:
        description: "Disable Samsung debug/TIMA/security extras that stock W2014 may not use (true/false)"
        default: "false"
env:
  MAX_RECOVERY_BYTES: 13631488
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev lzop python3
      - name: Fetch Samsung KitKat kernel (pristine drop) and toolchain
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/friedrich420/Note-3-AEL-Kernel kernel
          git -C kernel checkout aa26888
          git -C kernel log -1 --format='%h %ad %s' --date=short
          if [ "${{ inputs.gcc }}" = "4.7" ]; then
            # Android NDK r8e ships gcc 4.7 for ARM (same generation as Samsung's arm-eabi-4.7)
            curl -fsSL -o ndk.tar.bz2 https://dl.google.com/android/ndk/android-ndk-r8e-linux-x86_64.tar.bz2
            tar -xjf ndk.tar.bz2 --wildcards 'android-ndk-r8e/toolchains/arm-linux-androideabi-4.7/prebuilt/linux-x86_64/*'
            mv android-ndk-r8e/toolchains/arm-linux-androideabi-4.7/prebuilt/linux-x86_64 toolchain
            ls toolchain/bin | head
            toolchain/bin/arm-linux-androideabi-gcc --version | head -1
          else
            git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain
          fi
      - name: Make the python2 gcc wrapper a pass-through
        run: printf '#!/bin/sh\nexec "$@"\n' > kernel/scripts/gcc-wrapper.py && chmod +x kernel/scripts/gcc-wrapper.py
      - name: Fix old Perl construct that modern Perl rejects
        run: |
          sed -i 's/if (!defined(@val))/if (!@val)/' kernel/kernel/timeconst.pl
          grep -n "if (!@val)" kernel/kernel/timeconst.pl
      - name: Configure and build (gzip)
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          cd kernel
          make HOSTCFLAGS=-fcommon msm8974_sec_defconfig VARIANT_DEFCONFIG=${{ inputs.variant }} SELINUX_DEFCONFIG=selinux_defconfig
          scripts/config --disable KERNEL_XZ --disable KERNEL_LZO --disable KERNEL_LZMA --enable KERNEL_GZIP
          # Stock W2014 kernel was an ENG build WITHOUT FIPS; FIPS makes the loader copy the zImage to 0x20000000 first
          scripts/config --disable CRYPTO_FIPS
          if [ "${{ inputs.strip }}" = "true" ]; then
            # without SEC_DEBUG this file loses its declaration of sec_class
            sed -i '0,/^#ifdef CONFIG_SEC_DEBUG/s//extern struct class *sec_class;\n#ifdef CONFIG_SEC_DEBUG/' drivers/platform/msm/qpnp-power-on.c
            for o in SEC_MISC SEC_DEBUG SEC_DEBUG_SCHED_LOG SEC_DEBUG_SEMAPHORE_LOG SEC_DEBUG_USER SEC_DEBUG_SUBSYS SEC_DEBUG_DOUBLE_FREE SEC_DEBUG_NOCACHE_LOG SEC_DEBUG_NOCACHE_LOG_IN_LEVEL_LOW SEC_DEBUG_LEVEL_LOW SEC_DEBUG_MDM_FILE_INFO SEC_DEBUG_FUPLOAD_DUMP_MORE SEC_DEBUG_TSP_LOG SEC_DEBUG_LOW_LOG TIMA TIMA_LOG TIMA_LKMAUTH TIMA_LKMAUTH_CODE_PROT TIMA_ENABLED SEC_RESTRICT_SETUID SEC_RESTRICT_ROOTING_LOG SEC_RESTRICT_FORK SEC_RESTRICT_ROOTING SEC_PERIPHERAL_SECURE SAMSUNG_KERNEL_DEBUG_USER KERNEL_DEBUG_SEC SEC_SSR_DEBUG_LEVEL_CHK SEC_DEBUG_AUTO_COMMENT SEC_AVC_LOG SEC_DEBUG_MSG_LOG SEC_FORKHANDLER SEC_MODEM_DEBUG; do scripts/config --disable $o; done
          fi
          yes "" | make HOSTCFLAGS=-fcommon oldconfig > /dev/null
          grep -E "^CONFIG_KERNEL_(XZ|LZO|GZIP|LZMA)=|^CONFIG_MACH_|^CONFIG_SEC_.*PROJECT|CRYPTO_FIPS" .config
          make -j"$(nproc)" HOSTCFLAGS=-fcommon CONFIG_NO_ERROR_ON_MISMATCH=y zImage > ../build.log 2>&1 || {
            echo "=== build failed, first errors ==="
            make HOSTCFLAGS=-fcommon CONFIG_NO_ERROR_ON_MISMATCH=y zImage 2>&1 | grep -v -E "^\s+(CC|LD|AR|AS|HOSTCC|GEN|CHK|UPD|LDS|CALL)\s" | tail -25
            exit 1
          }
          ls -la arch/arm/boot/zImage
      - name: Compare symbol table with the stock W2014 kernel
        continue-on-error: true
        run: python3 tools/symdiff.py boot/stock_syms.txt kernel/System.map | cut -c1-12000
      - name: Which device-tree nodes does my kernel not know?
        continue-on-error: true
        run: |
          python3 tools/extract_stock_image.py boot/stock_kernel "$GITHUB_WORKSPACE/stock_Image_cc" >/dev/null
          python3 tools/compat_check.py boot/stock_dt0.dts kernel/vmlinux "$GITHUB_WORKSPACE/stock_Image_cc" | cut -c1-6000
      - name: Control test - stock kernel Image inside this build's loader
        if: ${{ inputs.stock_payload == 'true' }}
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          python3 tools/extract_stock_image.py boot/stock_kernel "$GITHUB_WORKSPACE/stock_Image"
          printf '%s\n' '#!/bin/sh' 'for last; do :; done' 'case "$last" in */boot/Image) cp "$STOCK_IMAGE" "$last"; exit 0;; esac' 'exec "$REAL_OBJCOPY" "$@"' > objcopy-wrap.sh
          chmod +x objcopy-wrap.sh
          export STOCK_IMAGE="$GITHUB_WORKSPACE/stock_Image" REAL_OBJCOPY="${CROSS_COMPILE}objcopy"
          cd kernel
          rm -f arch/arm/boot/Image arch/arm/boot/zImage arch/arm/boot/compressed/piggy.gzip arch/arm/boot/compressed/piggy.gzip.o arch/arm/boot/compressed/vmlinux
          make HOSTCFLAGS=-fcommon CONFIG_NO_ERROR_ON_MISMATCH=y OBJCOPY="$GITHUB_WORKSPACE/objcopy-wrap.sh" zImage 2>&1 | tail -12
          cmp arch/arm/boot/Image "$STOCK_IMAGE" && echo "CONFIRMED: arch/arm/boot/Image is byte-identical to the STOCK kernel"
          ls -la arch/arm/boot/Image arch/arm/boot/zImage
      - name: Diagnose - compare my loader stub with the stock one
        if: always()
        run: |
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          cd kernel
          echo "== sizes"; ls -l ../boot/stock_kernel arch/arm/boot/zImage arch/arm/boot/Image arch/arm/boot/compressed/ 2>&1 | head -40
          echo "== stock zImage first 112 bytes"; xxd -l 112 ../boot/stock_kernel
          echo "== my zImage first 112 bytes"; xxd -l 112 arch/arm/boot/zImage
          echo "== my zImage last 16 bytes"; tail -c 16 arch/arm/boot/zImage | xxd
          echo "== stock zImage last 16 bytes"; tail -c 16 ../boot/stock_kernel | xxd
          head -c 6196 ../boot/stock_kernel > ../stock_stub.bin
          head -c 6196 arch/arm/boot/zImage > ../my_stub.bin
          echo "== DISASM stock stub (first 120)"; ${CROSS_COMPILE}objdump -D -b binary -marm ../stock_stub.bin | sed -n 1,130p
          echo "== DISASM my stub (first 120)"; ${CROSS_COMPILE}objdump -D -b binary -marm ../my_stub.bin | sed -n 1,130p
          echo "== my stub ELF sections"; ${CROSS_COMPILE}readelf -S arch/arm/boot/compressed/vmlinux | head -30
          echo "== relevant config"; grep -E "AUTO_ZRELADDR|ZBOOT_ROM|APPENDED_DTB|ARM_PATCH_PHYS|PHYS_OFFSET|CPU_V7|THUMB2|ARM_ASM_UNIFIED|CPU_ENDIAN|XIP_KERNEL|ARCH_MSM8974|KERNEL_(GZIP|LZO|LZMA|XZ)" .config
          echo "== Makefile.boot (msm)"; grep -n "8974\|zreladdr\|params_phys\|initrd_phys" arch/arm/mach-msm/Makefile.boot | head
      - name: Put the new kernel into the working TWRP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p twrp out
          gh run download 42451273149 -R lunarreii299-ship-it/montblanc-twrp -n twrp-sm-w2014 -D twrp
          tar -xf twrp/TWRP_W2014_hyb_gz.tar -C twrp
          DT_PATCH='${{ inputs.dt_patch }}' python3 tools/swap_kernel.py twrp/recovery.img kernel/arch/arm/boot/zImage out/recovery.img
          sz=$(stat -c %s out/recovery.img); echo "recovery.img = $sz (limit $MAX_RECOVERY_BYTES)"
          [ "$sz" -le "$MAX_RECOVERY_BYTES" ] || { echo "TOO LARGE"; exit 1; }
          printf 'SEANDROIDENFORCE' >> out/recovery.img
          tar -H ustar -c -C out recovery.img > RECOVERY_W2014_${{ inputs.stock_payload == 'true' && 'control2' || inputs.dt_patch != '' && 'dtpatch' || (inputs.gcc == '4.7' && 'gcc47' || (inputs.strip == 'true' && 'strip' || 'kk_nofips')) }}.tar
          sha256sum RECOVERY_W2014_${{ inputs.stock_payload == 'true' && 'control2' || inputs.dt_patch != '' && 'dtpatch' || (inputs.gcc == '4.7' && 'gcc47' || (inputs.strip == 'true' && 'strip' || 'kk_nofips')) }}.tar
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: w2014-recovery-${{ inputs.stock_payload == 'true' && 'control2' || inputs.dt_patch != '' && 'dtpatch' || (inputs.gcc == '4.7' && 'gcc47' || (inputs.strip == 'true' && 'strip' || 'kk-nofips')) }}
          path: RECOVERY_W2014_${{ inputs.stock_payload == 'true' && 'control2' || inputs.dt_patch != '' && 'dtpatch' || (inputs.gcc == '4.7' && 'gcc47' || (inputs.strip == 'true' && 'strip' || 'kk_nofips')) }}.tar
          compression-level: 0
