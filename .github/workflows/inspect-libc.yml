name: Inspect libc (find the arch-timer instruction)
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CM libc.so
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi e2fsprogs
          mkdir cm && cd cm
          curl -fL --retry 3 -o cm.zip https://archive.org/download/cmarchive_nighlies/cm-12.1-20161016-NIGHTLY-hlte.zip
          unzip -q cm.zip system.new.dat system.transfer.list
          python3 - <<'P'
          import re
          lines=open('system.transfer.list').read().split('\n')
          src=open('system.new.dat','rb'); out=open('/tmp/cm.raw','wb')
          for l in lines[2:]:
              m=re.match(r'new (\S+)',l)
              if not m: continue
              r=list(map(int,m.group(1).split(',')))[1:]
              for a,b in zip(r[0::2],r[1::2]):
                  out.seek(a*4096); out.write(src.read((b-a)*4096))
          out.close()
          P
          debugfs -R "dump /lib/libc.so /tmp/libc.so" /tmp/cm.raw
          ls -l /tmp/libc.so
      - name: Find mrrc p15 (ec510f1e) and show surroundings
        run: |
          python3 - <<'P'
          d=open('/tmp/libc.so','rb').read()
          pat=bytes.fromhex('1e0f51ec')
          i=0; hits=[]
          while True:
              i=d.find(pat,i)
              if i<0: break
              hits.append(i); i+=4
          print('hits at file offsets:',[hex(h) for h in hits])
          for h in hits: print('offset mod 0x1000:',hex(h%0x1000))
          P
          arm-linux-gnueabi-objdump -d -M force-thumb /tmp/libc.so --start-address=0 --stop-address=0 >/dev/null 2>&1 || true
          arm-linux-gnueabi-objdump -d /tmp/libc.so > /tmp/libc.dis 2>/dev/null || true
          wc -l /tmp/libc.dis
          grep -n "mrrc\|e320f000\|f26001f0" /tmp/libc.dis | head -20
          echo "== dynamic symbol table entries around the hit"
          arm-linux-gnueabi-readelf -sW --dyn-syms /tmp/libc.so | sort -k2 | awk '{print $2,$3,$8}' > /tmp/syms.txt
          python3 - <<'P'
          import re,subprocess
          d=open('/tmp/libc.so','rb').read()
          h=d.find(bytes.fromhex('1e0f51ec'))
          syms=[]
          for l in open('/tmp/syms.txt'):
              p=l.split()
              if len(p)==3 and re.match(r'^[0-9a-f]+$',p[0]):
                  try: syms.append((int(p[0],16),int(p[1]),p[2]))
                  except: pass
          syms.sort()
          best=None
          for a,s,n in syms:
              if (a&~1)<=h: best=(a,s,n)
          print('nearest symbol before hit',hex(h),'->',best)
          P
      - name: Disassemble the function around the hit
        run: |
          python3 - <<'P' > /tmp/start.txt
          d=open('/tmp/libc.so','rb').read()
          h=d.find(bytes.fromhex('1e0f51ec'))
          print(hex(max(0,h-0x60)),hex(h+0x60))
          P
          read A B < /tmp/start.txt
          arm-linux-gnueabi-objdump -d --start-address=$A --stop-address=$B /tmp/libc.so | tail -60
          echo "== all mrrc / mcrr p15 users"
          grep -c "mrrc" /tmp/libc.dis || true
