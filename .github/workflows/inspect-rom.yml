name: Inspect base ROM (CM 12.1 hlte)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "ROM zip URL"
        default: "https://archive.org/download/cmarchive_nighlies/cm-12.1-20161016-NIGHTLY-hlte.zip"
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download ROM
        run: |
          curl -fL --retry 3 -o rom.zip "${{ inputs.url }}"
          ls -l rom.zip; sha256sum rom.zip
      - name: Inspect
        run: |
          mkdir rom && cd rom && unzip -q ../rom.zip
          echo "== top level"; ls -la
          echo "== system size"; du -sh system; du -sh system/* | sort -h | tail -8
          echo "== updater-script (head)"; sed -n 1,60p META-INF/com/google/android/updater-script
          echo "== build.prop (key lines)"; grep -E "ro.build.(version|id|date|display)|ro.product|ro.sf.lcd|ro.carrier|ro.cm.version|persist.sys.dalvik|ro.zygote|ro.opengles" system/build.prop
          echo "== boot.img"; ls -l boot.img; python3 - <<'P'
          import struct
          d=open('boot.img','rb').read()
          ksz,ka,rsz,ra,ssz,sa,tags,page,dtsz=struct.unpack('<9I',d[8:44])
          print('kernel',ksz,hex(ka),'ramdisk',rsz,hex(ra),'dt',dtsz,'page',page,'cmdline',d[64:576].split(b'\0')[0].decode())
          P
          echo "== sepolicy"; mkdir ../rd && cd ../rd
          python3 - <<'P'
          import struct,gzip,io,subprocess
          d=open('../rom/boot.img','rb').read()
          ksz,ka,rsz,ra,ssz,sa,tags,page,dtsz=struct.unpack('<9I',d[8:44])
          n=lambda x:(x+page-1)//page*page
          r=d[page+n(ksz):page+n(ksz)+rsz]
          open('ramdisk.gz','wb').write(r)
          P
          (gzip -dc ramdisk.gz | cpio -id --quiet 2>/dev/null) || true
          ls; ls -la sepolicy file_contexts init.rc 2>&1 | head
          python3 - <<'P'
          import struct,os
          if os.path.exists('sepolicy'):
              d=open('sepolicy','rb').read()
              magic,l=struct.unpack('<II',d[:8]); ver=struct.unpack('<I',d[8+l:12+l])[0]
              print('sepolicy magic',hex(magic),'policy version',ver)
          P
          echo "== recovery fstab / partition names"; cat system/etc/recovery.fstab 2>/dev/null | head -20; cat ../rd/fstab.qcom 2>/dev/null | head -20; ls ../rd/*.rc | head -30
      - name: Look inside the system image
        run: |
          cd rom
          cat system.transfer.list
          python3 - <<'P'
          import re
          lines=open('system.transfer.list').read().split('\n')
          total=int(lines[1]); print('image blocks',total,'=',total*4096//1048576,'MB')
          out=open('../system.img','wb'); out.truncate(total*4096)
          src=open('system.new.dat','rb')
          for l in lines[2:]:
              m=re.match(r'new (\S+)',l)
              if not m: continue
              r=list(map(int,m.group(1).split(',')))[1:]
              for a,b in zip(r[0::2],r[1::2]):
                  out.seek(a*4096); out.write(src.read((b-a)*4096))
          out.close()
          P
          file ../system.img; xxd -s 1024 -l 96 ../system.img | head -6
          D() { debugfs -R "$1" ../system.img 2>&1; }
          echo "== superblock"; dumpe2fs -h ../system.img 2>&1 | grep -E "features|Block count|Block size|Filesystem" | head
          echo "== system top"; D "ls /" | head -20
          echo "== lib/hw"; D "ls /lib/hw" | head -40
          echo "== egl"; D "ls /lib/egl" | head
          echo "== vendor"; D "ls /vendor" | head; D "ls /vendor/lib" | head -5
          echo "== modules"; D "ls /lib/modules" | head
          echo "== apps"; D "ls /priv-app" | head -40
