name: Build W2014 kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS kernel branch"
        default: "lineage-18.1"
env:
  MAX_BOOT_BYTES: 11534336   # boot partition (0xB00000)
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev lzop python3
      - name: Fetch kernel + toolchain
        run: |
          git clone --depth 1 -b "${{ inputs.branch }}" https://github.com/LineageOS/android_kernel_samsung_msm8974 kernel
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain
      - name: Patch tree for Montblanc
        run: python3 tools/patch_kernel.py kernel
      - name: Configure
        working-directory: kernel
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          make lineage_hltechn_defconfig
          for o in MACH_MONTBLANC SEC_MONTBLANC_PROJECT KEYBOARD_MATRIX; do scripts/config --enable $o; done
          # Camera comes later: camera_ll needs lp8720.h (unpublished) for MONTBLANC
          for o in MSMB_CAMERA_LL MSM_CAMERA_SENSOR LEDS_MAX77803; do scripts/config --disable $o; done
          scripts/config --disable KERNEL_LZMA --disable KERNEL_LZO --enable KERNEL_GZIP || true
          yes "" | make oldconfig > /dev/null
          grep -E "MONTBLANC|KEYBOARD_MATRIX|^CONFIG_KERNEL_|SECCOMP=|BT_BCM4339|BCM4339=" .config
      - name: Build test variants
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          mkdir -p out
          cp kernel/.config base.config
          build_variant() {
            n=$1; shift
            cd "$GITHUB_WORKSPACE/kernel"
            cp ../base.config .config
            scripts/config "$@"
            yes "" | make oldconfig > /dev/null
            grep -E "^CONFIG_KERNEL_(XZ|LZO|GZIP)=|^CONFIG_SEC_DEBUG=|^CONFIG_SEC_LOG_LAST_KMSG=" .config
            if ! make -j"$(nproc)" zImage > ../build_$n.log 2>&1; then
              echo "=== variant $n FAILED, first errors: ==="
              make zImage 2>&1 | grep -E "error|Error" | head -15
              cd "$GITHUB_WORKSPACE"; return 1
            fi
            cd "$GITHUB_WORKSPACE"
            ls -la kernel/arch/arm/boot/zImage
            python3 tools/mkbootimg.py kernel/arch/arm/boot/zImage boot/stock_ramdisk.gz boot/stock_dt.img out/boot.img
            sz=$(stat -c %s out/boot.img); echo "variant $n boot.img = $sz (limit $MAX_BOOT_BYTES)"
            [ "$sz" -le "$MAX_BOOT_BYTES" ] || { echo "TOO LARGE"; return 1; }
            printf 'SEANDROIDENFORCE' >> out/boot.img
            tar -H ustar -c -C out boot.img > out/BOOT_W2014_$n.tar
            rm out/boot.img
          }
          build_variant A_lzo --disable KERNEL_XZ --enable KERNEL_LZO
          build_variant B_gzip --disable KERNEL_XZ --enable KERNEL_GZIP
          build_variant C_lzo_debug --disable KERNEL_XZ --enable KERNEL_LZO --enable SEC_DEBUG --enable SEC_LOG_LAST_KMSG || echo "variant C could not be built"
          sha256sum out/*.tar
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2014-kernel
          path: |
            out/*.tar
            build_*.log
          compression-level: 0
