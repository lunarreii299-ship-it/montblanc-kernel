name: Build W2014 kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS kernel branch"
        default: "lineage-18.1"
env:
  MAX_BOOT_BYTES: 11534336   # boot partition (0xB00000)
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev lzop python3
      - name: Fetch kernel + toolchain
        run: |
          git clone --depth 1 -b "${{ inputs.branch }}" https://github.com/LineageOS/android_kernel_samsung_msm8974 kernel
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain
      - name: Patch tree for Montblanc
        run: python3 tools/patch_kernel.py kernel
      - name: Configure
        working-directory: kernel
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          make lineage_hltechn_defconfig
          for o in MACH_MONTBLANC SEC_MONTBLANC_PROJECT KEYBOARD_MATRIX; do scripts/config --enable $o; done
          # Camera comes later: camera_ll needs lp8720.h (unpublished) for MONTBLANC
          for o in MSMB_CAMERA_LL MSM_CAMERA_SENSOR LEDS_MAX77803; do scripts/config --disable $o; done
          scripts/config --disable KERNEL_LZMA --disable KERNEL_LZO --enable KERNEL_GZIP || true
          yes "" | make oldconfig > /dev/null
          grep -E "MONTBLANC|KEYBOARD_MATRIX|^CONFIG_KERNEL_|SECCOMP=|BT_BCM4339|BCM4339=" .config
      - name: Build kernel with the Samsung crash-log buffer (gzip)
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          cd kernel
          cp .config ../base.config
          ok=0
          try_cfg() {
            echo "=== trying: $* ==="
            cp ../base.config .config
            scripts/config --disable KERNEL_XZ --disable KERNEL_LZO --enable KERNEL_GZIP "$@"
            yes "" | make oldconfig > /dev/null
            grep -E "^CONFIG_KERNEL_(XZ|LZO|GZIP)=|^CONFIG_SEC_DEBUG[A-Z_]*=" .config
            if make -j"$(nproc)" zImage > ../build.log 2>&1; then ok=1; echo "=== built OK ==="; else
              echo "--- failed, first errors:"; make zImage 2>&1 | grep -E "error|undefined reference" | head -8; fi
          }
          try_cfg --enable SEC_DEBUG --enable SEC_DEBUG_SCHED_LOG
          [ $ok = 1 ] || try_cfg --enable SEC_DEBUG --enable SEC_DEBUG_SCHED_LOG --enable SEC_DEBUG_SEMAPHORE_LOG --enable SEC_DEBUG_SUBSYS
          [ $ok = 1 ] || try_cfg --enable SEC_DEBUG --enable SEC_DEBUG_SCHED_LOG --enable SEC_DEBUG_SEMAPHORE_LOG --enable SEC_DEBUG_SUBSYS --enable SEC_DEBUG_MSG_LOG --enable SEC_DEBUG_AVC_LOG
          [ $ok = 1 ] || { echo "no option set compiled"; exit 1; }
          ls -la arch/arm/boot/zImage
      - name: Pack boot image (new kernel + stock ramdisk + stock dt)
        run: |
          mkdir -p out
          python3 tools/mkbootimg.py kernel/arch/arm/boot/zImage boot/stock_ramdisk.gz boot/stock_dt.img out/boot.img
          sz=$(stat -c %s out/boot.img); echo "boot.img = $sz (limit $MAX_BOOT_BYTES)"
          [ "$sz" -le "$MAX_BOOT_BYTES" ] || { echo "TOO LARGE"; exit 1; }
          printf 'SEANDROIDENFORCE' >> out/boot.img
          tar -H ustar -c -C out boot.img > BOOT_W2014_dbglog.tar
          sha256sum BOOT_W2014_dbglog.tar
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: w2014-boot-dbglog
          path: BOOT_W2014_dbglog.tar
          compression-level: 0
