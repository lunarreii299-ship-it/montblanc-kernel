name: Build W2014 kernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "LineageOS kernel branch"
        default: "lineage-18.1"
env:
  MAX_BOOT_BYTES: 11534336   # boot partition (0xB00000)
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev lzop python3
      - name: Fetch kernel + toolchain
        run: |
          git clone --depth 1 -b "${{ inputs.branch }}" https://github.com/LineageOS/android_kernel_samsung_msm8974 kernel
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain
      - name: Patch tree for Montblanc
        run: python3 tools/patch_kernel.py kernel
      - name: Configure
        working-directory: kernel
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          make lineage_hltechn_defconfig
          for o in MACH_MONTBLANC SEC_MONTBLANC_PROJECT KEYBOARD_MATRIX; do scripts/config --enable $o; done
          # Camera comes later: camera_ll needs lp8720.h (unpublished) for MONTBLANC
          for o in MSMB_CAMERA_LL MSM_CAMERA_SENSOR LEDS_MAX77803; do scripts/config --disable $o; done
          scripts/config --disable KERNEL_LZMA --disable KERNEL_LZO --enable KERNEL_GZIP || true
          yes "" | make oldconfig > /dev/null
          grep -E "MONTBLANC|KEYBOARD_MATRIX|^CONFIG_KERNEL_|SECCOMP=|BT_BCM4339|BCM4339=" .config
      - name: Build kernel (gzip)
        run: |
          export ARCH=arm CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
          cd kernel
          scripts/config --disable KERNEL_XZ --disable KERNEL_LZO --enable KERNEL_GZIP
          scripts/config --enable VT --enable VT_CONSOLE --enable FRAMEBUFFER_CONSOLE --disable FONTS
          yes "" | make oldconfig > /dev/null
          grep -E "^CONFIG_KERNEL_(XZ|LZO|GZIP)=|^CONFIG_FRAMEBUFFER_CONSOLE=|^CONFIG_VT_CONSOLE=|^CONFIG_FONT_8x16=|^CONFIG_FONTS=" .config
          make -j"$(nproc)" zImage > ../build.log 2>&1 || { make zImage 2>&1 | grep -E "error|Error" | head -20; exit 1; }
          ls -la arch/arm/boot/zImage
      - name: Fetch the working TWRP and swap in the new kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p twrp out
          gh run download 42451273149 -R lunarreii299-ship-it/montblanc-twrp -n twrp-sm-w2014 -D twrp
          ls -la twrp
          tar -xf twrp/TWRP_W2014_hyb_gz.tar -C twrp
          python3 tools/swap_kernel.py twrp/recovery.img kernel/arch/arm/boot/zImage out/recovery.img "console=tty0 ignore_loglevel panic=0 androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x3F androidboot.selinux=permissive"
          sz=$(stat -c %s out/recovery.img); echo "recovery.img = $sz (limit 13631488)"
          [ "$sz" -le 13631488 ] || { echo "TOO LARGE"; exit 1; }
          printf 'SEANDROIDENFORCE' >> out/recovery.img
          tar -H ustar -c -C out recovery.img > RECOVERY_W2014_dbg.tar
          sha256sum RECOVERY_W2014_dbg.tar
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: w2014-recovery-dbg
          path: RECOVERY_W2014_dbg.tar
          compression-level: 0
